# Nixpacks automatically uses this template instead of its default PHP config.
worker_processes auto;
daemon off;

events {
    worker_connections 1024;
}

http {
    include $!{nginx}/conf/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    sendfile on;
    server_tokens off;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name sergiotech.es;
        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )
        index index.php;
        charset utf-8;
        autoindex off;

        # TLS terminates at the proxy. Relative redirects preserve external HTTPS.
        absolute_redirect off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($host = www.sergiotech.es) {
            return 301 https://sergiotech.es$request_uri;
        }

        # Translate legacy language links before Nginx adds a directory slash.
        if ($arg_lang ~* "^es$") {
            rewrite ^/apps/savetempo(?:/index\.php)?/?$ /es/apps/savetempo/? permanent;
            rewrite ^/apps/savetempo/(privacy|support|terms)(?:/index\.php)?/?$ /es/apps/savetempo/$1/? permanent;
            rewrite ^/apps/savetempo/52-week-savings-challenge(?:/index\.php)?/?$ /es/apps/savetempo/reto-ahorro-52-semanas/? permanent;
            rewrite ^/apps/savetempo/365-day-savings-challenge(?:/index\.php)?/?$ /es/apps/savetempo/reto-ahorro-365-dias/? permanent;
            rewrite ^/apps/savetempo/savings-challenge-app(?:/index\.php)?/?$ /es/apps/savetempo/app-retos-ahorro/? permanent;
        }
        if ($arg_lang ~* "^en$") {
            rewrite ^/apps/savetempo(?:/index\.php)?/?$ /apps/savetempo/? permanent;
            rewrite ^/apps/savetempo/(privacy|support|terms|52-week-savings-challenge|365-day-savings-challenge|savings-challenge-app)(?:/index\.php)?/?$ /apps/savetempo/$1/? permanent;
        }

        rewrite ^(/apps/savetempo(?:/(?:privacy|support|terms|52-week-savings-challenge|365-day-savings-challenge|savings-challenge-app))?)$ $1/ permanent;
        rewrite ^(/es/apps/savetempo(?:/(?:privacy|support|terms|reto-ahorro-52-semanas|reto-ahorro-365-dias|app-retos-ahorro))?)$ $1/ permanent;

        location / {
            try_files $uri $uri/ =404;
        }

        location ^~ /tests/ { return 404; }
        location ^~ /docs/ { return 404; }
        location ^~ /components/ { return 404; }
        location ~ ^/apps/savetempo/(config|content|components)/ { return 404; }
        location ~ /\.(?!well-known/) { deny all; }
        location ~* \.(env|ini|log|md|json|lock|conf)$ { return 404; }
        location = /localization.php { return 404; }
        location = /mailer.php { return 404; }

        location ~ \.php$ {
            try_files $uri =404;
            include $!{nginx}/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
